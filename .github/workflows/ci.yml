# Continuous integration.
#
# The important property here is the environment, not the commands: GitHub runs
# this on a machine that has never seen the project. Locally, the tests pass
# against a PostgreSQL instance that has been running for days and already holds
# every table, so nothing has ever verified that a fresh clone can start from an
# empty database. This workflow does exactly that.
#
# Costs nothing: Actions is free without a minute limit for public repositories.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same branch: the older result
# cannot describe the current commit and would only compete for a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (JDK 21 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metrics
          POSTGRES_USER: metrics
          # Throwaway container on a runner that is discarded when the job ends,
          # so this is not a deployment default: nothing in the repository points
          # here unless a job sets DB_PASSWORD explicitly.
          POSTGRES_PASSWORD: metrics
        ports:
          - 5432:5432
        # Without a health check the first test can reach a database that is
        # still initialising, which fails intermittently rather than honestly.
        options: >-
          --health-cmd "pg_isready -U metrics -d metrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        # These are unit tests and start no Spring context, so no datasource is
        # involved and DB_PASSWORD is deliberately not set for this step. It has
        # no default any more (application.yml), so a test that started needing
        # a database would fail here and say so rather than connect silently.
        run: mvn -B test

      - name: Verify the schema script is idempotent on a fresh database
        env:
          PGPASSWORD: metrics
        # schema.sql runs on every startup (spring.sql.init.mode=always), so a
        # CREATE TABLE that loses its IF NOT EXISTS, or an unguarded INSERT,
        # breaks the second boot. The long-lived local instance never showed
        # that; this empty database does.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U metrics -d metrics -v ON_ERROR_STOP=1 -f src/main/resources/schema.sql
          psql -h 127.0.0.1 -U metrics -d metrics -v ON_ERROR_STOP=1 -f src/main/resources/schema.sql

  frontend:
    name: frontend (Node + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly the lockfile and fails when package.json and the
      # lockfile disagree, which is the check worth having on every push.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
